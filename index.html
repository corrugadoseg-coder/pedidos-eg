<style>

body{font-family:Arial,sans-serif;background:#f5f5f0;color:#222;font-size:14px}

nav button.active{color:#1a1a2e;border-bottom-color:#1a1a2e;font-weight:600}

.page{display:none;padding:20px 24px;max-width:1400px;margin:0 auto}
.page.active{display:block}
.card{background:#fff;border-radius:8px;border:1px solid #e0e0e0;padding:20px;margin-bottom:16px}

h3{font-size:14px;font-weight:600;margin-bottom:12px;color:#333}

.toolbar input{min-width:220px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-row span{font-size:12px;color:#888}
.fbtn{padding:5px 14px;border:1px solid #ccc;border-radius:20px;background:#fff;font-size:12px;cursor:pointer;color:#555}
.fbtn.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.res-info{font-size:12px;color:#888;margin-bottom:8px}
.date-range{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.date-range label{font-size:12px;color:#666;font-weight:600}
.date-range input{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:12px}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.btn-dark{background:#1a1a2e;color:#fff}
.btn-dark:hover{background:#2d2d4e}
.btn-green{background:#2e7d32;color:#fff}
.btn-green:hover{background:#1b5e20}
.btn-outline{background:#fff;color:#1a1a2e;border:1px solid #1a1a2e}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:4px;border:1px solid #ccc;cursor:pointer;background:#fff}

table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:#f0f0ec;color:#555;font-weight:600;padding:9px 10px;text-align:left;border-bottom:1px solid #e0e0e0;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{background:#e8e8e4}
tbody tr{border-bottom:1px solid #f0f0f0}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fafaf8}
tbody tr.anulado{opacity:.5}
tbody tr.anulado td{text-decoration:line-through;color:#999}
tbody td{padding:7px 10px;vertical-align:middle}
.badge{background:#e8f0fe;color:#1a56db;font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600;white-space:nowrap}
.badge-prov{background:#e8f5e9;color:#2e7d32}

<body>
<header>
  <div>
    <h1>E.G. Corrugados S.R.L.</h1>
    <span>Sistema de pedidos de materia prima</span>
  </div>
</header>
<nav>
  <button class="active" onclick="goTo('buscar',this)">Buscador</button>
  <button onclick="goTo('nuevo',this)">Nuevo pedido</button>
  <button onclick="goTo('proveedores',this)">Por proveedor</button>
  <button onclick="goTo('historial',this)">Historial</button>
</nav>

<div id="page-buscar" class="page active">
  <div class="card">
    <h2>Buscador de pedidos</h2>
    <div class="toolbar">
      <input type="text" id="q-buscar" placeholder="Buscar..." oninput="renderBuscar()">
      <select id="prov-filter-b" onchange="renderBuscar()"><option value="">Todos los proveedores</option></select>
      <button class="btn btn-dark" onclick="exportCSV('buscar')">Exportar CSV</button>
    </div>
    <div class="filter-row">
      <span>Filtrar por:</span>
      <button class="fbtn active" onclick="setFB('todos',this)">Todos</button>
      <button class="fbtn" onclick="setFB('Pedido',this)">N pedido</button>
      <button class="fbtn" onclick="setFB('Fecha',this)">Fecha</button>
      <button class="fbtn" onclick="setFB('Cliente',this)">Cliente</button>
      <button class="fbtn" onclick="setFB('Tipo Material',this)">Articulo</button>
    </div>
    <div class="res-info" id="res-buscar"></div>
    <div class="tbl-wrap"><table><thead><tr id="thead-buscar"></tr></thead><tbody id="tbody-buscar"></tbody></table></div>
  </div>
</div>

<div id="page-nuevo" class="page">
  <div class="card">
    <h2>Nuevo pedido</h2>
    <div class="form-grid">
      <div class="form-group"><label>N de Pedido</label><input type="text" id="f-pedido" placeholder="Ej: 1401"></div>
      <div class="form-group"><label>Fecha</label><input type="date" id="f-fecha"></div>
      <div class="form-group"><label>Proveedor</label><select id="f-proveedor" onchange="updateProvFields()"></select></div>
      <div class="form-group"><label>Email del proveedor</label><input type="email" id="f-email" placeholder="proveedor@email.com"></div>
    </div>
    <hr class="form-divider">
    <h3>Items del pedido</h3>
    <div style="overflow-x:auto">
      <table class="items-table"><thead id="items-thead"></thead><tbody id="items-body"></tbody></table>
    </div>
    <button class="btn btn-outline" style="margin-bottom:12px" onclick="addItemRow()">+ Agregar item</button>
    <hr class="form-divider">
    <h3>Vista previa del mail <span style="font-size:11px;color:#888;font-weight:400">(sin datos internos)</span></h3>
    <div id="preview-box" class="preview-box"><p style="color:#aaa;font-size:12px">Hace click en Previsualizar para ver el pedido</p></div>
    <div class="actions-row">
      <button class="btn btn-dark" onclick="previewMail()">Previsualizar</button>
      <button class="btn btn-green" onclick="copyMail()">Copiar para mail</button>
      <button class="btn btn-dark" onclick="printPedido()">Imprimir pedido</button>
      <button class="btn btn-dark" onclick="guardarPedido()">Guardar pedido</button>
    </div>
    <div id="status-nuevo" class="status"></div>
  </div>
</div>

<div id="page-proveedores" class="page">
  <div class="card">
    <h2>Pedidos por proveedor</h2>
    <div class="prov-tabs" id="prov-tabs"></div>
    <div class="toolbar">
      <button class="btn btn-dark" onclick="exportCSV('prov')">Exportar CSV</button>
    </div>
    <div class="res-info" id="res-prov"></div>
    <div class="tbl-wrap"><table><thead><tr id="thead-prov"></tr></thead><tbody id="tbody-prov"></tbody></table></div>
  </div>
</div>

<div id="page-historial" class="page">
  <div class="card">
    <h2>Historial completo</h2>
    <div class="toolbar">
      <input type="text" id="q-hist" placeholder="Buscar..." oninput="renderHistorial()">
      <select id="prov-filter-h" onchange="renderHistorial()"><option value="">Todos los proveedores</option></select>
      <button class="btn btn-dark" onclick="exportCSV('hist')">Exportar CSV</button>
    </div>
    <div class="date-range">
      <label>Desde:</label><input type="text" id="h-desde" placeholder="01/01/26" oninput="renderHistorial()" style="width:90px">
      <label>Hasta:</label><input type="text" id="h-hasta" placeholder="31/12/26" oninput="renderHistorial()" style="width:90px">
      <label>Pedido desde:</label><input type="text" id="h-ped-desde" placeholder="001" oninput="renderHistorial()" style="width:70px">
      <label>hasta:</label><input type="text" id="h-ped-hasta" placeholder="999" oninput="renderHistorial()" style="width:70px">
      <button class="btn-sm" onclick="clearHistFilters()">Limpiar</button>
    </div>
    <div class="res-info" id="res-hist"></div>
    <div class="tbl-wrap"><table><thead><tr id="thead-hist"></tr></thead><tbody id="tbody-hist"></tbody></table></div>
  </div>
</div>

var allData = [];
var sortCol = "Pedido", sortDir = 1;
var filterField = "todos";
var activeProv = "Idesa";
var itemRows = [];
var lastPreviewText = "";

function loadData() {
  allData = SEED_IDESA.map(r2o).concat(SEED_MICROMONT.map(r2o)).concat(SEED_ASERPEL.map(r2o)).concat(SEED_ROLPEL.map(r2o));
  renderAll();
  fetch(API).then(function(r) { return r.json(); }).then(function(json) {
    if (json.ok && json.data && json.data.length) {
      var key = function(d) { return d.Pedido+"|"+d.Cliente+"|"+d["Tipo Material"]+"|"+d.Proveedor; };
      var sk = new Set(allData.map(key));
      var nr = json.data.filter(function(d) { return d.Pedido && !sk.has(key(d)); });
      allData = allData.concat(nr);
      renderAll();
    }
  }).catch(function() {});
}

function renderAll() { renderBuscar(); renderProveedores(); renderHistorial(); buildProvFilters(); buildProvSelect(); }

function hl(t, q) {
  if (!q) return String(t || "");
  var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return String(t || "").replace(re, "<mark>$1</mark>");
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  renderAll();
}

function parseDate(s) {
  if (!s) return null;
  var p = s.split("/");
  if (p.length === 3) return new Date(2000 + parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
  return null;
}

function getFiltered(q, prov, field, desde, hasta, pd, ph) {
  return allData.filter(function(r) {
    if (prov && r.Proveedor !== prov) return false;
    if (q) {
      var qq = q.toLowerCase();
      var m = field === "todos"
        ? Object.values(r).some(function(v) { return String(v).toLowerCase().includes(qq); })
        : String(r[field] || "").toLowerCase().includes(qq);
      if (!m) return false;
    }
    if (desde || hasta) {
      var rd = parseDate(r.Fecha);
      if (desde && rd && rd < parseDate(desde)) return false;
      if (hasta && rd && rd > parseDate(hasta)) return false;
    }
    if (pd && parseInt(r.Pedido) < parseInt(pd)) return false;
    if (ph && parseInt(r.Pedido) > parseInt(ph)) return false;
    return true;
  });
}

function getSorted(arr) {
  return arr.slice().sort(function(a, b) {
    var va = String(a[sortCol] || ""), vb = String(b[sortCol] || "");
    var na = parseFloat(va), nb = parseFloat(vb);
    if (!isNaN(na) && !isNaN(nb)) return (na - nb) * sortDir;
    return va.localeCompare(vb, "es") * sortDir;
  });
}

function estadoBadge(e) {
  if (e === "Recibido") return '<span class="badge-rec">Recibido</span>';
  if (e === "Anulado") return '<span class="badge-anu">Anulado</span>';
  return '<span class="badge-env">Enviado</span>';
}

function makeHead(cols, showProv) {
  var h = cols.map(function(c) {
    return '<th onclick="sortBy(\'' + c.key + '\')">' + c.label + ' <span style="opacity:.4">&#8597;</span></th>';
  }).join("");
  if (showProv) h += '<th onclick="sortBy(\'Proveedor\')">Proveedor <span style="opacity:.4">&#8597;</span></th>';
  return h;
}

function makeRow(r, q, cols, showProv) {
  var cells = cols.map(function(c) {
    var v = r[c.key] || "";
    if (c.key === "Estado") return "<td>" + estadoBadge(v) + "</td>";
    if (c.key === "Pedido") return '<td><span class="badge">' + hl(v, q) + "</span></td>";
    if (c.key === "Observaciones" || c.key === "Anotaciones") return '<td class="obs-cell">' + hl(v, q) + "</td>";
    if (c.key === "Cantidad") return '<td style="font-weight:600">' + hl(v, q) + "</td>";
    return "<td>" + hl(v, q) + "</td>";
  }).join("");
  if (showProv) cells += '<td><span class="badge badge-prov">' + (r.Proveedor || "") + "</span></td>";
  var cls = r.Estado === "Anulado" ? ' class="anulado"' : "";
  return "<tr" + cls + ">" + cells + "</tr>";
}

function setFB(f, btn) {
  filterField = f;
  document.querySelectorAll(".fbtn").forEach(function(b) { b.classList.remove("active"); });
  btn.classList.add("active");
  renderBuscar();
}

function renderBuscar() {
  var q = document.getElementById("q-buscar").value.trim().toLowerCase();
  var prov = document.getElementById("prov-filter-b").value;
  var cols = getCols(prov || "Idesa");
  var filtered = getSorted(getFiltered(q, prov, filterField, "", "", "", ""));
  document.getElementById("res-buscar").textContent = filtered.length + " resultado" + (filtered.length !== 1 ? "s" : "") + " de " + allData.length + " registros";
  document.getElementById("thead-buscar").innerHTML = makeHead(cols, true);
  var tb = document.getElementById("tbody-buscar");
  tb.innerHTML = filtered.length ? filtered.map(function(r) { return makeRow(r, q, cols, true); }).join("") : '<tr><td colspan="20" class="empty-state">Sin resultados</td></tr>';
}

function buildProvFilters() {
  var provs = Array.from(new Set(allData.map(function(r) { return r.Proveedor; }).filter(Boolean))).sort();
  ["prov-filter-b", "prov-filter-h"].forEach(function(id) {
    var sel = document.getElementById(id);
    if (!sel) return;
    var cur = sel.value;
    sel.innerHTML = '<option value="">Todos los proveedores</option>' + provs.map(function(p) {
      return '<option value="' + p + '"' + (p === cur ? " selected" : "") + ">" + p + "</option>";
    }).join("");
  });
}

function renderProveedores() {
  var provs = Array.from(new Set(allData.map(function(r) { return r.Proveedor; }).filter(Boolean))).sort();
  if (!activeProv || !provs.includes(activeProv)) activeProv = provs[0] || "";
  document.getElementById("prov-tabs").innerHTML = provs.map(function(p) {
    return '<button class="ptab' + (p === activeProv ? " active" : "") + '" onclick="setProv(\'' + p + '\')">' + p + "</button>";
  }).join("");
  var cols = getCols(activeProv);
  var rows = getSorted(allData.filter(function(r) { return r.Proveedor === activeProv; }));
  document.getElementById("res-prov").textContent = rows.length + " registro" + (rows.length !== 1 ? "s" : "");
  document.getElementById("thead-prov").innerHTML = makeHead(cols, false);
  var tb = document.getElementById("tbody-prov");
  tb.innerHTML = rows.length ? rows.map(function(r) { return makeRow(r, "", cols, false); }).join("") : '<tr><td colspan="15" class="empty-state">Sin registros</td></tr>';
}

function setProv(p) { activeProv = p; renderProveedores(); }

function renderHistorial() {
  var q = document.getElementById("q-hist").value.trim().toLowerCase();
  var prov = document.getElementById("prov-filter-h").value;
  var desde = document.getElementById("h-desde").value.trim();
  var hasta = document.getElementById("h-hasta").value.trim();
  var pd = document.getElementById("h-ped-desde").value.trim();
  var ph = document.getElementById("h-ped-hasta").value.trim();
  var cols = getCols(prov || "Idesa");
  var filtered = getSorted(getFiltered(q, prov, "todos", desde, hasta, pd, ph));
  document.getElementById("res-hist").textContent = filtered.length + " registro" + (filtered.length !== 1 ? "s" : "");
  document.getElementById("thead-hist").innerHTML = makeHead(cols, true);
  var tb = document.getElementById("tbody-hist");
  tb.innerHTML = filtered.length ? filtered.map(function(r) { return makeRow(r, q, cols, true); }).join("") : '<tr><td colspan="20" class="empty-state">Sin resultados</td></tr>';
}

function clearHistFilters() {
  ["h-desde", "h-hasta", "h-ped-desde", "h-ped-hasta", "q-hist"].forEach(function(id) {
    document.getElementById(id).value = "";
  });
  renderHistorial();
}

function exportCSV(page) {
  var rows = [];
  if (page === "buscar") {
    var q = document.getElementById("q-buscar").value.trim().toLowerCase();
    var prov = document.getElementById("prov-filter-b").value;
    rows = getSorted(getFiltered(q, prov, filterField, "", "", "", ""));
  } else if (page === "prov") {
    rows = getSorted(allData.filter(function(r) { return r.Proveedor === activeProv; }));
  } else {
    rows = getSorted(allData);
  }
  var csv = [COLS_ALL.join(",")].concat(rows.map(function(r) {
    return COLS_ALL.map(function(c) { return '"' + String(r[c] || "").replace(/"/g, '""') + '"'; }).join(",");
  })).join("\n");
  var a = document.createElement("a");
  a.href = "data:text/csv;charset=utf-8,\uFEFF" + encodeURIComponent(csv);
  a.download = "pedidos_eg.csv";
  a.click();
}

function updateProvFields() {
  var prov = document.getElementById("f-proveedor").value;
  var cols = getCols(prov).filter(function(c) { return !["Pedido", "Fecha", "Estado", "Proveedor"].includes(c.key); });
  document.getElementById("items-thead").innerHTML = "<tr>" + cols.map(function(c) { return "<th>" + c.label + "</th>"; }).join("") + "<th></th></tr>";
  document.getElementById("items-body").innerHTML = "";
  itemRows = [];
  addItemRow();
  var peds = allData.filter(function(r) { return r.Proveedor === prov; }).map(function(r) { return parseInt(r.Pedido); }).filter(function(n) { return !isNaN(n); });
  var sig = peds.length ? Math.max.apply(null, peds) + 1 : 1;
  var inp = document.getElementById("f-pedido");
  inp.value = String(sig).padStart(3, "0");
  inp.style.background = "#f0f7ff";
}

function addItemRow(data) {
  var prov = document.getElementById("f-proveedor").value;
  var cols = getCols(prov).filter(function(c) { return !["Pedido", "Fecha", "Estado", "Proveedor"].includes(c.key); });
  var id = "item_" + Date.now() + "_" + Math.floor(Math.random() * 9999);
  itemRows.push(id);
  var d = data || {};
  var tr = document.createElement("tr");
  tr.id = id;
  var cells = cols.map(function(c) {
    var v = d[c.key] || "";
    if (c.type === "dropdown") {
      var opts = c.options.map(function(o) { return "<option" + (o === v ? " selected" : "") + ">" + o + "</option>"; }).join("");
      var onch = c.key === "Tipo Material" ? " onchange=\"toggleOtro(this)\"" : "";
      var extra = "<input type=\"text\" placeholder=\"Especificar...\" style=\"margin-top:4px;display:none\" class=\"otro-input\">";
      return "<td><select" + onch + ">" + opts + "</select>" + extra + "</td>";
    }
    if (c.type === "textarea") return "<td><textarea rows=\"4\">" + v + "</textarea></td>";
    var onin = c.key === "N Caja" ? " oninput=\"autocompleteCaja(this,'" + id + "')\"" : "";
    return "<td><input type=\"" + (c.type || "text") + "\" placeholder=\"" + c.label + "\" value=\"" + v + "\"" + onin + "></td>";
  }).join("");
  tr.innerHTML = cells + "<td><button class=\"btn-remove\" onclick=\"removeRow('" + id + "')\">x</button></td>";
  document.getElementById("items-body").appendChild(tr);
}

function removeRow(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
  itemRows = itemRows.filter(function(i) { return i !== id; });
}

function toggleOtro(sel) {
  var extra = sel.parentElement.querySelector(".otro-input");
  if (!extra) return;
  extra.style.display = sel.value === "Otro (especificar)" ? "block" : "none";
  if (sel.value !== "Otro (especificar)") extra.value = "";
}

function autocompleteCaja(input, id) {
  var caja = input.value.trim();
  if (!caja) return;
  var match = allData.find(function(r) { return String(r["N Caja"]).trim() === caja; });
  if (!match) return;
  var prov = document.getElementById("f-proveedor").value;
  var cols = getCols(prov).filter(function(c) { return !["Pedido", "Fecha", "Estado", "Proveedor"].includes(c.key); });
  var tr = document.getElementById(id);
  if (!tr) return;
  var inputs = tr.querySelectorAll("input,select,textarea");
  cols.forEach(function(c, i) {
    if (c.key === "N Caja") return;
    if (match[c.key] && inputs[i]) inputs[i].value = match[c.key];
  });
}

function getItems() {
  var prov = document.getElementById("f-proveedor").value;
  var cols = getCols(prov).filter(function(c) { return !["Pedido", "Fecha", "Estado", "Proveedor"].includes(c.key); });
  return itemRows.map(function(id) {
    var tr = document.getElementById(id);
    if (!tr) return null;
    var inputs = tr.querySelectorAll("input,select,textarea");
    var obj = {};
    cols.forEach(function(c, i) {
      if (!inputs[i]) return;
      if (c.key === "Tipo Material" && inputs[i].value === "Otro (especificar)") {
        var extra = inputs[i].parentElement.querySelector(".otro-input");
        obj[c.key] = extra && extra.value ? extra.value : inputs[i].value;
      } else {
        obj[c.key] = inputs[i].value;
      }
    });
    return obj;
  }).filter(Boolean);
}

function fmtDate(v) {
  if (!v) return new Date().toLocaleDateString("es-AR");
  return v.split("-").reverse().join("/");
}

function buildPreviewHTML(ped, fecha, prov, items, mailCols) {
  var heads = mailCols.map(function(c) {
    return "<th style='padding:7px 10px;background:#f0f0ec;border:1px solid #ddd;font-size:12px;text-align:left;white-space:nowrap'>" + c.label + "</th>";
  }).join("");
  var rows = items.map(function(it) {
    return "<tr>" + mailCols.map(function(c) {
      return "<td style='padding:6px 10px;border:1px solid #ddd;font-size:12px'>" + (it[c.key] || "") + "</td>";
    }).join("") + "</tr>";
  }).join("");
  return "<div style='font-family:Arial,sans-serif;font-size:13px'>" +
    "<p style='margin-bottom:4px'><strong>E.G. CORRUGADOS S.R.L.</strong></p>" +
    "<p style='margin-bottom:4px'>GUIDO PEDIDO N " + ped + "</p>" +
    "<p style='margin-bottom:4px'>Fecha: " + fecha + "</p>" +
    "<p style='margin-bottom:12px'>Proveedor: " + prov + "</p>" +
    "<table style='border-collapse:collapse;width:100%'><thead><tr>" + heads + "</tr></thead><tbody>" + rows + "</tbody></table>" +
    "<p style='margin-top:16px;font-size:12px'>ENVIADO VIA E-MAIL</p>" +
    "</div>";
}

function previewMail() {
  var ped = document.getElementById("f-pedido").value || "--";
  var fecha = fmtDate(document.getElementById("f-fecha").value);
  var prov = document.getElementById("f-proveedor").value;
  var items = getItems();
  if (!items.length) { alert("Agrega al menos un item"); return; }
  var mailCols = getCols(prov).filter(function(c) { return c.mail && c.key !== "Pedido" && c.key !== "Fecha"; });
  var html = buildPreviewHTML(ped, fecha, prov, items, mailCols);
  document.getElementById("preview-box").innerHTML = html;
  var txt = "E.G. CORRUGADOS S.R.L.\nGUIDO PEDIDO N " + ped + "\nFecha " + fecha + "\nProveedor: " + prov + "\n\n";
  txt += mailCols.map(function(c) { return c.label; }).join("\t") + "\n";
  items.forEach(function(it) {
    txt += mailCols.map(function(c) { return it[c.key] || ""; }).join("\t") + "\n";
  });
  txt += "\nENVIADO VIA E-MAIL";
  lastPreviewText = txt;
}

function copyMail() {
  previewMail();
  var ped = document.getElementById("f-pedido").value || "--";
  var fecha = fmtDate(document.getElementById("f-fecha").value);
  var prov = document.getElementById("f-proveedor").value;
  var items = getItems();
  if (!items.length) return;
  var mailCols = getCols(prov).filter(function(c) { return c.mail && c.key !== "Pedido" && c.key !== "Fecha"; });
  var html = buildPreviewHTML(ped, fecha, prov, items, mailCols);
  var blob = new Blob([html], {type: "text/html"});
  var clipItem = new ClipboardItem({"text/html": blob});
  navigator.clipboard.write([clipItem]).then(function() {
    showStatus("ok", "Tabla copiada. Pega directamente en Gmail u Outlook y se vera con columnas alineadas.");
    setTimeout(function() { document.getElementById("status-nuevo").style.display = "none"; }, 4000);
  }).catch(function() {
    navigator.clipboard.writeText(lastPreviewText).then(function() {
      showStatus("ok", "Copiado como texto. Podes pegarlo en el mail.");
      setTimeout(function() { document.getElementById("status-nuevo").style.display = "none"; }, 3000);
    });
  });
}

function printPedido() {
  previewMail();
  var ped = document.getElementById("f-pedido").value || "--";
  var fecha = fmtDate(document.getElementById("f-fecha").value);
  var prov = document.getElementById("f-proveedor").value;
  var items = getItems();
  if (!items.length) { alert("Agrega al menos un item"); return; }
  var mailCols = getCols(prov).filter(function(c) { return c.mail && c.key !== "Pedido" && c.key !== "Fecha"; });
  var html = buildPreviewHTML(ped, fecha, prov, items, mailCols);
  var iframe = document.getElementById("print-iframe");
  if (!iframe) {
    iframe = document.createElement("iframe");
    iframe.id = "print-iframe";
    iframe.style.cssText = "position:fixed;top:-9999px;left:-9999px;width:800px;height:600px;border:none";
    document.body.appendChild(iframe);
  }
  iframe.contentDocument.open();
  iframe.contentDocument.write("<html><head><title>Pedido " + ped + "</title><style>body{font-family:Arial,sans-serif;padding:24px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:7px 10px;font-size:13px}th{background:#f0f0ec}</style></head><body>" + html + "</body></html>");
  iframe.contentDocument.close();
  setTimeout(function() { iframe.contentWindow.focus(); iframe.contentWindow.print(); }, 500);
}

function showStatus(type, msg) {
  var s = document.getElementById("status-nuevo");
  s.className = "status " + type;
  s.textContent = msg;
}

async function guardarPedido() {
  var ped = document.getElementById("f-pedido").value.trim();
  var fecha = fmtDate(document.getElementById("f-fecha").value);
  var prov = document.getElementById("f-proveedor").value;
  var items = getItems();
  if (!ped || !items.length) { showStatus("err", "Completa el N de pedido y al menos un item."); return; }
  showStatus("loading", "Guardando...");
  var ok = true;
  for (var i = 0; i < items.length; i++) {
    var row = Object.assign({}, items[i], {Pedido: ped, Fecha: fecha, Estado: "Enviado", Proveedor: prov});
    try {
       await fetch(API, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({action: "add", row: row})});
    } catch(e) { ok = false; }
  }
  if (ok) { showStatus("ok", "Pedido N " + ped + " guardado con " + items.length + " item(s)."); renderAll(); }
  else showStatus("err", "Error al guardar. Verifica la conexion.");
}

function buildProvSelect() {
  var provs = Object.keys(PROV_COLS);
  var sel = document.getElementById("f-proveedor");
  sel.innerHTML = provs.map(function(p) { return "<option value='" + p + "'>" + p + "</option>"; }).join("");
}

function goTo(page, btn) {
  document.querySelectorAll(".page").forEach(function(p) { p.classList.remove("active"); });
  document.querySelectorAll("nav button").forEach(function(b) { b.classList.remove("active"); });
  document.getElementById("page-" + page).classList.add("active");
  btn.classList.add("active");
  if (page === "proveedores") renderProveedores();
}

document.getElementById("f-fecha").valueAsDate = new Date();
buildProvSelect();
updateProvFields();
loadData();
</script>
